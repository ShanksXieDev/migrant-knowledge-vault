# Migrant Knowledge Vault —— Dioxus CLI 0.7.x 配置
#
# Web 端为**纯客户端**应用（无 fullstack server）：
# 索引为构建期内嵌的预构建只读产物，运行时不依赖任何后端接口。
# 因此 `dx serve` 只需构建 client 目标（wasm32-unknown-unknown）。
#
# 用法：
#   dx serve --package mkv-web --port 8080
#   dx build --package mkv-web --release
#
# 说明：UI 样式表由 `mkv-ui` 通过 `include_str!` 内联进组件，
# 索引产物由 `packages/web/build.rs` 通过 `include_str!` 编进 wasm，
# 因此这里不需要配置 public_dir / 额外静态资源。

[application]
name = "migrant-knowledge-vault"
# 产物放到 target/ 下，避免污染工作区根目录（.gitignore 已忽略 target/）
out_dir = "target/dx"

[web.app]
title = "Migrant Knowledge Vault"

[web.watcher]
reload_html = true
watch_path = ["packages/ui/src", "packages/web/src"]
