[package]
name = "mkv-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Migrant Knowledge Vault 命令行工具：init / index / search / links / commit / demo"

[[bin]]
name = "mkv"
path = "src/main.rs"

[dependencies]
mkv-editors = { path = "../editors" }
mkv-core = { workspace = true, features = ["native"] }
anyhow.workspace = true
# 参考 MCP 适配器（`mkv editors stub`）需要读写 JSON-RPC 报文
serde_json.workspace = true
