[package]
name = "mkv-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Migrant Knowledge Vault Web 端（Dioxus web，wasm32）"
# 构建脚本：把预构建只读索引产物嵌入 wasm 二进制（决策②「随站打包」）
build = "build.rs"

[dependencies]
# Web 端不使用 native 特性（Tantivy / SQLite / Git 均为原生依赖），
# 索引采用「预构建只读索引」策略（技术方案设计 §4 / 决策 ②）
mkv-core = { workspace = true, default-features = false, features = ["web"] }
mkv-ui.workspace = true
dioxus = { workspace = true, features = ["web", "launch", "macro", "signals", "hooks", "html"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 远端索引热替换（可选增强）：仅 wasm32 需要浏览器 fetch 能力。
# 关闭 default features，避免引入 json / websocket / eventsource 等无关依赖。
gloo-net = { version = "0.6", default-features = false, features = ["http"] }

[dev-dependencies]
dioxus-ssr = "0.7"
# 纯 Rust 的最小异步执行器，仅用于在原生目标下驱动 `loader::load()` 做测试。
futures-executor = "0.3"
