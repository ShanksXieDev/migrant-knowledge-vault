[package]
name = "mkv-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Migrant Knowledge Vault 桌面端（Dioxus desktop）"

[dependencies]
mkv-editors = { path = "../editors" }
mkv-core = { workspace = true, features = ["native"] }
mkv-ui.workspace = true
dioxus = { workspace = true, features = ["desktop", "launch", "macro", "signals", "hooks", "html"] }
# Dioxus desktop 自带 tokio runtime，这里只启用 timer 用于 UI 自动刷新轮询
tokio = { version = "1", features = ["time"] }
