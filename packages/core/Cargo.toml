[package]
name = "mkv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Migrant Knowledge Vault 核心库：扫描 / 解析 / 索引 / 检索 / 双链 / Git / 编辑器路由"

[features]
default = ["native"]
# native：启用 Tantivy 全文索引 + SQLite 元数据 + Git 版本（Desktop / Mobile 目标）
# 同时启用中文分词器（jieba 经 include-flate 引入 zstd，需 C 编译器，故不进 wasm 目标）
native = [
    "dep:tantivy",
    "dep:rusqlite",
    "dep:git2",
    "dep:fs2",
    "dep:jieba-rs",
    "dep:tantivy-tokenizer-api",
    "dep:notify",
]
# web：仅纯 Rust 能力（wasm32 目标；索引采用预构建只读，见技术方案设计 §4）
web = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
sha2.workspace = true
calamine.workspace = true
quick-xml.workspace = true
zip.workspace = true

# 仅 native 目标使用的依赖
tantivy = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
jieba-rs = { workspace = true, optional = true }
tantivy-tokenizer-api = { workspace = true, optional = true }
# 文件监听（P0）：仅在 native 目标启用，wasm32 依赖树不得引入
notify = { workspace = true, optional = true }

# 进程外 JSON-RPC 后端的跨平台端到端测试。
# 用 `harness = false` 自制 runner：该测试需要**同时**扮演「测试运行器」与
# 「被客户端 spawn 的迷你上游」，默认 libtest harness 无法在两者间切换；
# 而用 `sh -c` / `cmd /C` 起服务器在两端语法不同，会让测试退化成 `#[cfg(unix)]`
# ——Windows 零覆盖，而 Windows 正是本项目的主力开发环境。
# 详见 tests/rpc_e2e.rs 顶部说明。
[[test]]
name = "rpc_e2e"
path = "tests/rpc_e2e.rs"
harness = false
required-features = ["native"]
