[package]
name = "mkv-editors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "插件聚合层：应用启动时把三个内置编辑器插件注入 mkv-core 注册表"

[dependencies]
# 启用 native：进程外后端（`mkv_core::backend::ExternalBackend`）要起子进程，
# 只有 native 目标才编译。本 crate 只被 Desktop / CLI / Mobile 链接，
# Web 只读端不依赖它，因此不会把原生依赖带进 wasm 产物。
mkv-core = { path = "../core", default-features = false, features = ["native"] }
mkv-editor-gridcraft = { path = "../plugins/gridcraft" }
mkv-editor-deckcraft = { path = "../plugins/deckcraft" }
mkv-editor-wordcraft = { path = "../plugins/wordcraft" }
