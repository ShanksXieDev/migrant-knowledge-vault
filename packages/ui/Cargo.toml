[package]
name = "mkv-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Migrant Knowledge Vault 共享 UI 组件（Web / Desktop / Mobile 三端复用）"

[dependencies]
# 仅使用 core 的纯 Rust 部分（types / service / format），保证 wasm32 可编译
mkv-core = { workspace = true, default-features = false }
# 不启用 "router"：本项目是单页只读/桌面应用，没有路由。
# 启用它会拖进 dioxus-router → url → idna（含大 Unicode 表），
# 而代码里零引用——实测是 wasm 体积的无谓大头。
dioxus = { workspace = true, features = ["launch", "macro", "signals", "hooks", "html"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# SSR 渲染：用于在测试中把组件渲染成 HTML，验证真实渲染结果。
dioxus-ssr = "0.7"
