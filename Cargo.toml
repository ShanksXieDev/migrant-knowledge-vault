[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/ui",
    "packages/cli",
    "packages/desktop",
    "packages/web",
    "packages/mobile",
    "packages/editors",
    "packages/plugins/gridcraft",
    "packages/plugins/deckcraft",
    "packages/plugins/wordcraft",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Migrant Knowledge Vault"]
repository = "https://github.com/your-org/migrant-knowledge-vault"

[workspace.dependencies]
# ---- 内部 crate ----
mkv-core = { path = "packages/core", default-features = false }
mkv-ui = { path = "packages/ui" }

# ---- 运行时 ----
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# ---- 检索 ----
tantivy = "0.27"
tantivy-tokenizer-api = "0.7"
jieba-rs = "0.11"

# ---- 存储 ----
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2.5"
sha2 = "0.10"

# ---- Git ----
git2 = "0.21"

# ---- 解析 ----
calamine = "0.38"
quick-xml = "0.42"
# 只保留 deflate：默认特性会引入 zstd（zstd-sys 需 C 编译器，wasm32 不可用）
zip = { version = "9.4", default-features = false, features = ["deflate"] }

# ---- 文件监听 / 锁 ----
notify = "8.2"
fs2 = "0.4"

# ---- UI ----
dioxus = { version = "0.7", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# 不要开 strip：wasm32 目标下较新的 rustc 会把 __wasm_bindgen_unstable /
# target_features 自定义段一并剥掉，wasm-bindgen 随后报
# "failed to read wasm-bindgen data"，release 站点直接构建失败（Linux CI 实测）。
# 体积优化交给 dx 的 wasm-opt —— 它作用于 wasm-bindgen 输出之后，不会破坏这些段。
strip = false
