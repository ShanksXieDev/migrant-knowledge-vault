[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/ui",
    "packages/cli",
    "packages/desktop",
    "packages/web",
    "packages/mobile",
    "packages/editors",
    "packages/plugins/gridcraft",
    "packages/plugins/deckcraft",
    "packages/plugins/wordcraft",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Migrant Knowledge Vault"]
repository = "https://github.com/your-org/migrant-knowledge-vault"

[workspace.dependencies]
# ---- 内部 crate ----
mkv-core = { path = "packages/core", default-features = false }
mkv-ui = { path = "packages/ui" }

# ---- 运行时 ----
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# ---- 检索 ----
tantivy = "0.27"
tantivy-tokenizer-api = "0.7"
jieba-rs = "0.11"

# ---- 存储 ----
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2.5"
sha2 = "0.10"

# ---- Git ----
git2 = "0.21"

# ---- 解析 ----
calamine = "0.38"
quick-xml = "0.42"
# 只保留 deflate：默认特性会引入 zstd（zstd-sys 需 C 编译器，wasm32 不可用）
zip = { version = "9.4", default-features = false, features = ["deflate"] }

# ---- 文件监听 / 锁 ----
notify = "8.2"
fs2 = "0.4"

# ---- UI ----
dioxus = { version = "0.7", default-features = false }

[profile.release]
opt-level = 3
# fat LTO：跨 crate 内联与去重，实测把 wasm 从 891KB 压到 693KB
# （单靠 opt-level="z" 只能到 822KB）。桌面端同样受益（跨 crate 内联更多，
# 通常更快），代价是编译时间从约 17s 增加到约 45s。
lto = "fat"
codegen-units = 1
# 不要开 strip：wasm32 目标下较新的 rustc 会把 __wasm_bindgen_unstable /
# target_features 自定义段一并剥掉，wasm-bindgen 随后报
# "failed to read wasm-bindgen data"，release 站点直接构建失败（Linux CI 实测）。
# 体积优化交给 dx 的 wasm-opt —— 它作用于 wasm-bindgen 输出之后，不会破坏这些段。
strip = false

# 仅对本项目自有 crate 启用体积优化（依赖 crate 保持 opt-level=3，
# 避免拖慢 tantivy / sqlite 的检索热路径）。
#
# 为什么需要它：rustc 的内联决策在 wasm-opt 之前就已固化，binaryen 只能
# 删除代码、无法「拆开」已被内联的函数，因此 Rust 侧的体积优化是必要的。
# 实测（同一份代码、同一工具链）：
#   opt-level=3            → 891,480 B
#   + opt-level="z"（自有）→ 822,067 B
#   + lto="fat"            → 693,304 B
#
# 影响面：本项目的 crate 不含检索热路径（热路径在 tantivy / sqlite 里，
# 它们仍是 opt-level=3）。F-12 正则引擎是逐字符解释器，实测吞吐下降
# 6%~22%（多数场景 8%~10%）：线性类 19.7→17.3、词类 7.7→7.0、
# 字符类 10.5→9.9、惰性量词 8.6→7.9、嵌套重复 11.7→9.1 M字符/s。
# 绝对速度仍远超交互需求（40KB 文档单次扫描约 4ms），换取 198KB 体积，
# 值得。
[profile.release.package.mkv-core]
opt-level = "z"
[profile.release.package.mkv-ui]
opt-level = "z"
[profile.release.package.mkv-web]
opt-level = "z"
