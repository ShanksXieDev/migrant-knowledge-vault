<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="P-3 文档工作区（预览 = 编辑同页）">
<title>P-3 文档工作区（预览 = 编辑同页）</title>
<style>
.bg{fill:#ffffff}
.panel{fill:#ffffff;stroke:#e9eaef;stroke-width:1}
.sunken{fill:#f7f8fb}
.bar{fill:#fbfbfd}
.divider{stroke:#e9eaef;stroke-width:1}
.ln{stroke:#c7cad5;stroke-width:1}
.ln-dash{stroke:#c7cad5;stroke-width:1;stroke-dasharray:3 3}
.hit{fill:#5b76fe;fill-opacity:.16}
.t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#555a6a}
.th{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:12px;font-weight:600;fill:#1c1c1e}
.t14{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:14px;font-weight:600;fill:#1c1c1e}
.t18{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:18px;font-weight:600;fill:#1c1c1e}
.tiny{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:10px;fill:#a5a8b5}
.micro{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:10px;letter-spacing:.6px;fill:#555a6a}
.mono{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:11px;fill:#555a6a}
.mono-b{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:11px;fill:#1c1c1e}
.btn{fill:#ffffff;stroke:#c7cad5;stroke-width:1}
.btn-p{fill:#5b76fe;stroke:#5b76fe;stroke-width:1}
.btn-t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;font-weight:600;fill:#1c1c1e}
.btn-pt{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;font-weight:600;fill:#ffffff}
.chip{fill:#ffffff;stroke:#c7cad5;stroke-width:1}
.coral{fill:#ffc6c6}.coral-t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#600000}
.teal{fill:#c3faf5}.teal-t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#187574}
.rose{fill:#ffd8f4}
.orange{fill:#ffe6cd}
.pink{fill:#fde0f0}
.red{fill:#fbd4d4}.red-t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#8a2020}
.blue{fill:#5b76fe}
.gray{fill:#c7cad5}
.ok{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#00b473}
.badge{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:9.5px;letter-spacing:.5px;font-weight:600}
.anno{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;font-weight:700;fill:#ffffff}
.sel{fill:#eef1ff;stroke:#5b76fe;stroke-width:1}
</style>
<rect class="bg" x="0" y="0" width="960" height="640"/><rect x="16" y="16" width="928" height="608" class="panel" /><rect x="16" y="16" width="928" height="40" rx="8" class="bar" /><text x="32" y="41" class="t" >模式：预览 | 编辑 | 分栏</text><text x="300" y="41" class="t" >锚点：2.3 / 目标设备</text><text x="928" y="41" class="t" text-anchor="end">引擎：md ▾</text><line class="divider" x1="16" y1="56" x2="944" y2="56"/><text x="48" y="96" class="t18" ># 目标与范围</text><text x="48" y="122" class="t" >本文档描述本地知识库的产品目标与范围边界。</text><text x="48" y="152" class="t" >正文段落……（编辑态为块编辑，CtrlB 加粗、CtrlShiftX 插入引用）</text><rect x="48" y="168" width="12" height="12" rx="3" class="blue" /><text x="68" y="178" class="t" >引用：</text><rect class="hit" x="104" y="166" width="196" height="16" rx="4"/><text x="104" y="178" class="mono-b" >[[台账.xlsx#Sheet1!B2]]</text><text x="308" y="178" class="t" >其值为 120 万</text><rect x="48" y="200" width="400" height="96" rx="8" class="sunken" /><text x="60" y="222" class="mono" >▸ 代码块 #anchor</text><text x="60" y="244" class="mono" >vault = load_workspace(path)</text><text x="60" y="264" class="mono" >index = build_index(scope)</text><text x="60" y="280" class="tiny" >· 双击进入编辑；Esc 退出编辑</text><line class="divider" x1="16" y1="316" x2="944" y2="316"/><text x="32" y="340" class="th" >同一容器 · 按格式分发渲染器</text><rect x="32" y="352" width="210" height="44" rx="8" class="panel" /><rect x="42" y="364" width="10" height="14" rx="2" class="teal" /><text x="60" y="374" class="th" >Markdown</text><text x="60" y="388" class="tiny" >块编辑</text><rect x="258" y="352" width="210" height="44" rx="8" class="panel" /><rect x="268" y="364" width="10" height="14" rx="2" class="teal" /><text x="286" y="374" class="th" >DocxXML</text><text x="286" y="388" class="tiny" >TipTap 块</text><rect x="484" y="352" width="210" height="44" rx="8" class="panel" /><rect x="494" y="364" width="10" height="14" rx="2" class="teal" /><text x="512" y="374" class="th" >Base</text><text x="512" y="388" class="tiny" >多维表格</text><rect x="710" y="352" width="210" height="44" rx="8" class="panel" /><rect x="720" y="364" width="10" height="14" rx="2" class="orange" /><text x="738" y="374" class="th" >Excel</text><text x="738" y="388" class="tiny" >表格 / 单元格</text><rect x="32" y="406" width="210" height="44" rx="8" class="panel" /><rect x="42" y="418" width="10" height="14" rx="2" class="orange" /><text x="60" y="428" class="th" >PPT</text><text x="60" y="442" class="tiny" >幻灯片 / 页</text><rect x="258" y="406" width="210" height="44" rx="8" class="panel" /><rect x="268" y="418" width="10" height="14" rx="2" class="orange" /><text x="286" y="428" class="th" >Word</text><text x="286" y="442" class="tiny" >文档 / 章节</text><rect x="484" y="406" width="210" height="44" rx="8" class="panel" /><rect x="494" y="418" width="10" height="14" rx="2" class="rose" /><text x="512" y="428" class="th" >PDF</text><text x="512" y="442" class="tiny" >只读查看</text><rect x="710" y="406" width="210" height="44" rx="8" class="panel" /><rect x="720" y="418" width="10" height="14" rx="2" class="pink" /><text x="738" y="428" class="th" >Drawio</text><text x="738" y="442" class="tiny" >只读节点</text><line class="divider" x1="16" y1="466" x2="944" y2="466"/><text x="32" y="490" class="th" >锚点模型（点击来源必须可定位）</text><text x="32" y="514" class="mono" >md      path#heading / #block:&lt;id&gt;</text><text x="32" y="532" class="mono" >base    path#record:&lt;id&gt;</text><text x="32" y="550" class="mono" >xlsx    path#Sheet1!B2 或 #Sheet1!B2:D8</text><text x="32" y="568" class="mono" >pptx    path#p:7 / #p:7@&lt;element&gt;</text><text x="32" y="586" class="mono" >docx    path#第二章 / #para:&lt;id&gt;</text><rect x="32" y="614" width="912" height="1" rx="0" class="divider" />
</svg>
