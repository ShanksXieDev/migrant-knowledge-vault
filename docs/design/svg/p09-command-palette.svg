<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="P-9 命令面板">
<title>P-9 命令面板</title>
<style>
.bg{fill:#ffffff}
.panel{fill:#ffffff;stroke:#e9eaef;stroke-width:1}
.sunken{fill:#f7f8fb}
.bar{fill:#fbfbfd}
.divider{stroke:#e9eaef;stroke-width:1}
.ln{stroke:#c7cad5;stroke-width:1}
.ln-dash{stroke:#c7cad5;stroke-width:1;stroke-dasharray:3 3}
.hit{fill:#5b76fe;fill-opacity:.16}
.t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#555a6a}
.th{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:12px;font-weight:600;fill:#1c1c1e}
.t14{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:14px;font-weight:600;fill:#1c1c1e}
.t18{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:18px;font-weight:600;fill:#1c1c1e}
.tiny{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:10px;fill:#a5a8b5}
.micro{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:10px;letter-spacing:.6px;fill:#555a6a}
.mono{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:11px;fill:#555a6a}
.mono-b{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:11px;fill:#1c1c1e}
.btn{fill:#ffffff;stroke:#c7cad5;stroke-width:1}
.btn-p{fill:#5b76fe;stroke:#5b76fe;stroke-width:1}
.btn-t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;font-weight:600;fill:#1c1c1e}
.btn-pt{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;font-weight:600;fill:#ffffff}
.chip{fill:#ffffff;stroke:#c7cad5;stroke-width:1}
.coral{fill:#ffc6c6}.coral-t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#600000}
.teal{fill:#c3faf5}.teal-t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#187574}
.rose{fill:#ffd8f4}
.orange{fill:#ffe6cd}
.pink{fill:#fde0f0}
.red{fill:#fbd4d4}.red-t{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#8a2020}
.blue{fill:#5b76fe}
.gray{fill:#c7cad5}
.ok{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;fill:#00b473}
.badge{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:9.5px;letter-spacing:.5px;font-weight:600}
.anno{font-family:'Roobert PRO Medium','Noto Sans','Segoe UI','Microsoft YaHei',sans-serif;font-size:11px;font-weight:700;fill:#ffffff}
.sel{fill:#eef1ff;stroke:#5b76fe;stroke-width:1}
</style>
<rect x="0" y="0" width="900" height="560" fill="#1c1c1e" fill-opacity=".38"/><rect x="120" y="80" width="660" height="400" rx="16" class="panel" /><rect x="120" y="80" width="660" height="56" rx="16" class="bar" /><rect x="120" y="120" width="660" height="16" class="bar" /><text x="148" y="114" class="t" >🔍</text><text x="172" y="114" class="t" >输入命令或文件名…</text><line class="divider" x1="120" y1="136" x2="780" y2="136"/><rect x="132" y="148" width="636" height="40" rx="8" class="sel" /><text x="148" y="173" class="th" >提交：方案.pptx 的改动</text><rect x="600" y="158" width="56" height="20" rx="6" class="sunken" /><text x="628" y="172" class="tiny" text-anchor="middle">2</text><text x="676" y="173" class="tiny" text-anchor="end">CtrlEnter</text><rect x="700" y="158" width="60" height="20" rx="6" class="sunken" /><text x="730" y="172" class="micro" text-anchor="middle">文件</text><text x="148" y="219" class="t" >在台账中查找「营收 120」</text><rect x="600" y="204" width="56" height="20" rx="6" class="sunken" /><text x="628" y="218" class="tiny" text-anchor="middle"></text><text x="676" y="219" class="tiny" text-anchor="end">CtrlShiftF</text><rect x="700" y="204" width="60" height="20" rx="6" class="sunken" /><text x="730" y="218" class="micro" text-anchor="middle">搜索</text><text x="148" y="265" class="t" >打开 台账.xlsx</text><rect x="600" y="250" width="56" height="20" rx="6" class="sunken" /><text x="628" y="264" class="tiny" text-anchor="middle"></text><text x="676" y="265" class="tiny" text-anchor="end">CtrlO</text><rect x="700" y="250" width="60" height="20" rx="6" class="sunken" /><text x="730" y="264" class="micro" text-anchor="middle">文件</text><text x="148" y="311" class="t" >新建 Markdown 文档</text><rect x="600" y="296" width="56" height="20" rx="6" class="sunken" /><text x="628" y="310" class="tiny" text-anchor="middle"></text><text x="676" y="311" class="tiny" text-anchor="end">CtrlN</text><rect x="700" y="296" width="60" height="20" rx="6" class="sunken" /><text x="730" y="310" class="micro" text-anchor="middle">文件</text><text x="148" y="357" class="t" >插入引用…</text><rect x="600" y="342" width="56" height="20" rx="6" class="sunken" /><text x="628" y="356" class="tiny" text-anchor="middle"></text><text x="676" y="357" class="tiny" text-anchor="end">CtrlShiftR</text><rect x="700" y="342" width="60" height="20" rx="6" class="sunken" /><text x="730" y="356" class="micro" text-anchor="middle">编辑</text><text x="148" y="403" class="t" >重建索引</text><rect x="600" y="388" width="56" height="20" rx="6" class="sunken" /><text x="628" y="402" class="tiny" text-anchor="middle"></text><text x="676" y="403" class="tiny" text-anchor="end">AltR</text><rect x="700" y="388" width="60" height="20" rx="6" class="sunken" /><text x="730" y="402" class="micro" text-anchor="middle">索引</text><text x="148" y="449" class="t" >安装插件：Deck（PPTX 引擎）</text><rect x="600" y="434" width="56" height="20" rx="6" class="sunken" /><text x="628" y="448" class="tiny" text-anchor="middle"></text><text x="676" y="449" class="tiny" text-anchor="end">CtrlP</text><rect x="700" y="434" width="60" height="20" rx="6" class="sunken" /><text x="730" y="448" class="micro" text-anchor="middle">插件</text><line class="divider" x1="120" y1="440" x2="780" y2="440"/><text x="148" y="462" class="tiny" >↑↓ 选择　Enter 执行　Esc 关闭　Ctrl+1..9 直选</text><text x="772" y="462" class="tiny" text-anchor="end">聚合：文件 / 命令 / 插件 / 设置项</text>
</svg>
