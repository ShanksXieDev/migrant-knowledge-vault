# Migrant Knowledge Vault —— Web 静态发布质量门禁
#
# 方案 A：纯静态托管，零后端。
# 门禁内容：单测/集成测试全绿 → wasm32 零 C 依赖 → release 静态构建
#          → Playwright 真实浏览器回归 18/18 → 发布 GitHub Pages。
#
# 为什么用 Linux runner + 预编译 dx：
#   Windows MSVC 下 `cargo install dioxus-cli` 会在链接 proc-macro DLL 时
#   挂起（link.exe 卡死 20+ 分钟），因此 CI 固定用 ubuntu + 官方预编译二进制。
#   版本必须与项目 dioxus 0.7.10 严格一致，否则 wasm-bindgen 冲突。

name: Web (static) — build & verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DX_VERSION: "0.7.10"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 质量门禁（测试 + 构建 + 浏览器回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 wasm32 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖（desktop / mobile 的 webkit2gtk）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf

      - name: 安装 dx（官方预编译二进制 + sha256 校验）
        run: |
          set -euo pipefail
          BASE="https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}"
          curl -fsSL -A "mkv-ci" "$BASE/dx-x86_64-unknown-linux-gnu.tar.gz" -o dx.tar.gz
          curl -fsSL -A "mkv-ci" "$BASE/dx-x86_64-unknown-linux-gnu.sha256" -o dx.sha256
          EXPECTED="$(cut -d' ' -f1 dx.sha256)"
          ACTUAL="$(sha256sum dx.tar.gz | cut -d' ' -f1)"
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "dx sha256 校验失败"; exit 1; }
          mkdir -p dx-release
          tar -xzf dx.tar.gz -C dx-release
          DX_BIN="$(find dx-release -type f -name dx | head -n1)"
          [ -n "$DX_BIN" ] || { echo "压缩包中未找到 dx"; tar -tzf dx.tar.gz; exit 1; }
          chmod +x "$DX_BIN"
          install -m 0755 "$DX_BIN" "$HOME/.cargo/bin/dx"
          dx --version

      # ---------- 质量门禁 1：全量测试（P0 bug = 0） ----------
      - name: 全量测试
        run: cargo test --workspace

      - name: 移动端编译门禁（真机验证仍需人工，见 README）
        run: cargo build -p mkv-mobile

      # ---------- 质量门禁 2：wasm32 零 C 依赖 ----------
      - name: 检查 wasm32 依赖树无原生 / C 依赖
        run: |
          set -euo pipefail
          COUNT="$(cargo tree -p mkv-web --target wasm32-unknown-unknown --edges normal,build \
            | grep -icE 'tantivy|zstd|jieba|rusqlite|git2|notify|(^| )cc v|cmake' || true)"
          echo "wasm32 原生/C 依赖命中数：$COUNT"
          [ "$COUNT" = "0" ] || { echo 'wasm32 依赖树被污染'; exit 1; }

      # ---------- 质量门禁 3：release 静态站点 ----------
      - name: 构建静态站点（导出索引 → dx release → dist/）
        run: bash scripts/publish-web.sh

      - name: 校验静态产物清单
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/mkv-index.json
          test -f dist/.nojekyll
          grep -q 'src="\./assets/' dist/index.html
          echo "dist 文件数：$(find dist -type f | wc -l)"
          du -sh dist

      # ---------- 质量门禁 4：真实浏览器回归（核心链路 100%） ----------
      - name: 安装 Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright
          npx playwright install --with-deps chromium

      - name: 对 dist/ 跑 18 项浏览器交互回归
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist >/tmp/mkv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
          MKV_URL=http://127.0.0.1:8080 \
          MKV_BROWSER_CHANNEL=chromium \
          MKV_SHOT_DIR=docs/browser-validation/ci \
            node scripts/browser-check.cjs

      - name: 上传验证报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: docs/browser-validation/
          if-no-files-found: ignore

      - name: 上传 Pages 产物
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 新仓库默认未启用 Pages，直接 deploy-pages 会报「需要先配置 Pages」，
      # 让质量门禁看起来像失败。这里先探测，未配置则跳过发布并给出提示。
      - name: 检查 Pages 是否已启用 GitHub Actions 构建
        id: pages_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/mkv-pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$CODE" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages 尚未配置（Settings → Pages → Source: GitHub Actions），本次跳过发布；verify 门禁不受影响。"
          fi
      - id: deployment
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
