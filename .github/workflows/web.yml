# Migrant Knowledge Vault —— Web 静态发布质量门禁
#
# 方案 A：纯静态托管，零后端。
# 门禁内容：单测/集成测试全绿 → wasm32 零 C 依赖 → release 静态构建
#          → Playwright 真实浏览器回归 28/28 → 发布 GitHub Pages。
#
# 为什么用 Linux runner + 预编译 dx：
#   Windows MSVC 下 `cargo install dioxus-cli` 会在链接 proc-macro DLL 时
#   挂起（link.exe 卡死 20+ 分钟），因此 CI 固定用 ubuntu + 官方预编译二进制。
#   版本必须与项目 dioxus 0.7.10 严格一致，否则 wasm-bindgen 冲突。

name: Web (static) — build & verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DX_VERSION: "0.7.10"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 质量门禁（测试 + 构建 + 浏览器回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 wasm32 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖（desktop / mobile 的 webkit2gtk + binaryen 兜底）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf binaryen \
            cmake pkg-config zlib1g-dev
          # binaryen 提供 wasm-opt。apt 版本可能偏旧，因此这里只作为「兜底」，
          # 真正的版本自检放在体积门禁步骤里做（不满足能力要求会明确失败）。
          wasm-opt --version
          # cmake / pkg-config / zlib1g-dev 是给 crates.io 兜底通道用的：
          # `cargo install dioxus-cli` 会编译 git2 → libgit2-sys，
          # 它需要 cmake + cc + zlib 才能把 vendored libgit2 建起来。
          # GitHub 链路正常时这三个包是多余的，但装上几乎没有成本，
          # 却能在 GitHub CDN 抽风时保住整条流水线。

      - name: 安装 dx（官方预编译二进制 + sha256 校验；GitHub 链路失败回退 crates.io 源码编译）
        run: |
          set -euo pipefail
          ASSET="dx-x86_64-unknown-linux-gnu.tar.gz"
          SHA_ASSET="dx-x86_64-unknown-linux-gnu.sha256"
          BASE="https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}"
          REPO_API="https://api.github.com/repos/DioxusLabs/dioxus"
          # cargo install 与下面的 install 都落到 CARGO_HOME/bin，
          # 用同一个变量保证「二进制来源」和「后续探测路径」始终一致。
          CARGO_BIN="${CARGO_HOME:-$HOME/.cargo}/bin"
          export PATH="$CARGO_BIN:$PATH"
          DX_PATH="$CARGO_BIN/dx"

          # 通道 A：releases/download 直链。通道 B：GitHub API 资产（按 asset id）。
          # 为什么不只留 A：release 直链走 objects.githubusercontent.com 的 CDN，
          # 在代理或网络抖动下会返回 504（run #13 就栽在这里，且整条流水线被跳过）；
          # 而 api.github.com 走独立链路，实测稳定返回 200 + 完整 33MB 资产。
          # 两个通道的 sha256 校验完全一致，安全性不降低。
          download_with_retry() {
            # $1=输出文件 $2=尝试次数上限
            local out="$1" tries="$2" i=1
            while [ "$i" -le "$tries" ]; do
              echo "  尝试 $i/$tries：$3"
              if eval "$3"; then
                return 0
              fi
              echo "  第 $i 次失败，5 秒后重试"
              i=$((i + 1))
              sleep 5
            done
            return 1
          }

          fetch_release() {
            # 通道 A
            curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
              -A "mkv-ci" "$BASE/$1" -o "$2"
          }

          fetch_api() {
            # 通道 B：先取 release 元数据拿 asset id，再用 octet-stream 下载
            # 解析失败时静默返回空 id：让上层把它当成「这一通道不可用」，
            # 而不是抛一整屏 JSON traceback 干扰排查（网络失败时元数据不是 JSON）。
            local name="$1" out="$2" id
            id="$(curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
              -A "mkv-ci" "$REPO_API/releases/tags/v${DX_VERSION}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['id'] for a in d['assets'] if a['name']=='$name'))" 2>/dev/null || true)"
            [ -n "$id" ] || return 1
            curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
              -H "Accept: application/octet-stream" -A "mkv-ci" \
              "$REPO_API/releases/assets/$id" -o "$out"
          }

          # cargo_install <crate> <version> [额外 cargo install 参数...]
          # crates.io 兜底通道统一入口。
          # 为什么需要「换址重试」：GitHub runner 的 CARGO_HOME 默认是
          # /usr/local/cargo（镜像里的系统路径），普通用户未必可写，
          # cargo install 会报 Permission denied。换到 $HOME/.cargo 再试一次即可。
          # 换址后必须同步更新 CARGO_BIN / PATH / DX_PATH，
          # 保证「装到哪」和「后面去哪找」始终是同一个位置。
          cargo_install() {
            local crate="$1" ver="$2"; shift 2
            if cargo install "$crate" --version "$ver" "$@"; then
              return 0
            fi
            echo "::warning::cargo install $crate 到默认 CARGO_HOME 失败，改用 \$HOME/.cargo 重试"
            export CARGO_HOME="$HOME/.cargo"
            CARGO_BIN="$CARGO_HOME/bin"
            export PATH="$CARGO_BIN:$PATH"
            DX_PATH="$CARGO_BIN/dx"
            cargo install "$crate" --version "$ver" "$@"
          }

          echo "下载 $ASSET（优先 release 直链，失败回退 API 资产通道）"
          DX_FROM_CRATES=0
          if ! download_with_retry dx.tar.gz 3 \
            'fetch_release "$ASSET" dx.tar.gz || fetch_api "$ASSET" dx.tar.gz'; then
            # 兜底通道 C：crates.io（源码编译）。
            # 为什么不只留 GitHub 两个通道：Release 资产全部托管在
            # objects.githubusercontent.com 的 CDN 上，CI runner 到这条链路的
            # 成功率并不稳定（run #13 直链 504、run #21 双通道都失败）。
            # crates.io 是完全独立的另一条链路，且 dioxus-cli 0.7.10 就在上面
            # （已核对：未 yank，且该版本发布了 Cargo.lock，因此 --locked 可用，
            #  依赖解析结果可复现）。
            # 代价是从源码编译（约 5–12 分钟），但 Swatinem/rust-cache 会缓存
            # cargo 构建产物；换来的是彻底绕开 GitHub CDN。
            echo "::warning::dx 二进制下载失败（GitHub 双通道均不可用），改用 crates.io 源码编译"
            if ! cargo_install dioxus-cli "${DX_VERSION}" --locked --no-default-features; then
              echo "::error::dx 安装失败：GitHub 双通道与 crates.io 兜底全部不可用"
              exit 1
            fi
            DX_FROM_CRATES=1
          fi

          if [ "$DX_FROM_CRATES" != "1" ]; then
            echo "下载 $SHA_ASSET"
            download_with_retry dx.sha256 3 \
              'fetch_release "$SHA_ASSET" dx.sha256 || fetch_api "$SHA_ASSET" dx.sha256'

            # 官方 .sha256 同时列了 tar.gz 与 zip 两行；必须按文件名只取目标那一行，
            # 否则 EXPECTED 会变成两行拼接的字符串，与实际 hash 永不相等（首跑即栽在这里）。
            EXPECTED="$(awk -v f="$ASSET" '$2 == f { print $1 }' dx.sha256)"
            [ -n "$EXPECTED" ] || { echo "::error::sha256 清单中没有 $ASSET"; cat dx.sha256; exit 1; }
            ACTUAL="$(sha256sum dx.tar.gz | cut -d' ' -f1)"
            echo "expected=$EXPECTED"
            echo "actual  =$ACTUAL"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::dx sha256 校验失败（expected=$EXPECTED actual=$ACTUAL）"
              exit 1
            fi
            mkdir -p dx-release
            tar -xzf dx.tar.gz -C dx-release
            DX_BIN="$(find dx-release -type f -name dx | head -n1)"
            [ -n "$DX_BIN" ] || { echo "::error::压缩包中未找到 dx"; tar -tzf dx.tar.gz; exit 1; }
            chmod +x "$DX_BIN"
            mkdir -p "$CARGO_BIN"
            install -m 0755 "$DX_BIN" "$DX_PATH"
          fi

          # 两条来源（release 预编译 / crates.io 源码编译）在这里汇合：
          # 必须确认 dx 真的就位，否则后面探测版本号会静默取到空值。
          if [ ! -x "$DX_PATH" ]; then
            DX_PATH="$(command -v dx || true)"
          fi
          [ -n "$DX_PATH" ] && [ -x "$DX_PATH" ] || {
            echo "::error::dx 未就位（预期路径：$CARGO_BIN/dx）"
            exit 1
          }
          "$DX_PATH" --version

          # ---------- 预装 dx 构建期依赖（binaryen / wasm-bindgen） ----------
          # dx 在 release 构建时会自行下载这两个工具到 ~/.dx/tools/<name>-<ver>/：
          #   - binaryen（wasm-opt）：run #15 正是它没落地 → wasm 未优化 → 体积门禁失败
          #   - wasm-bindgen-cli：dx 构建时同样要下载，网络抖动就会卡在
          #     "Installing wasm-bindgen-cli@x.y.z"（run #19 日志停在这一步）
          # 两者都走 GitHub Release 直链，与 dx 二进制下载同一条不稳定链路。
          #
          # 这里在 dx 装好之后「预先显式安装到 dx 期望的目录」，
          # dx 检测到目录已存在就不再自行下载，从根上消除该失败模式。
          #
          # 注意两个版本号不是一回事，必须分清：
          #   - 工具索引号（TOOL）：决定缓存目录名 ~/.dx/tools/binaryen-<TOOL>
          #     （dx 二进制里硬编码为 wasm-opt129 → 目录 binaryen-129）
          #   - 上游 release 版本（RELEASE）：决定下载 URL
          #     （dx 二进制里硬编码为 version_127 → binaryen-version_127-*.tar.gz）

          # download_release <直链URL> <API仓库> <API tag> <资产文件名> <输出文件>
          # 双通道：直链优先，失败回退 GitHub API 资产（按 asset id）。
          download_release() {
            local url="$1" repo="$2" tag="$3" asset="$4" out="$5" id
            for attempt in 1 2 3; do
              if curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors -A "mkv-ci" \
                   "$url" -o "$out"; then
                return 0
              fi
              echo "  直链失败，尝试 API 资产通道"
              id="$(curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors -A "mkv-ci" \
                "https://api.github.com/repos/$repo/releases/tags/$tag" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['id'] for a in d['assets'] if a['name']=='$asset'))" 2>/dev/null || true)"
              if [ -n "$id" ] && curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
                   -H "Accept: application/octet-stream" -A "mkv-ci" \
                   "https://api.github.com/repos/$repo/releases/assets/$id" -o "$out"; then
                return 0
              fi
              echo "  第 $attempt 次下载失败，5 秒后重试"
              sleep 5
            done
            return 1
          }

          # install_tool <目标目录> <解压后顶层目录名> <可执行文件相对路径> <压缩包> <资产名>
          # 两个工具的官方 tar 结构不同，必须整目录搬运而不是只搬 exe 所在子目录：
          #   binaryen:   binaryen-version_127/{bin/wasm-opt, lib/...}
          #   wasm-bindgen: wasm-bindgen-0.2.130/{wasm-bindgen, ...}
          # dx 期望的缓存布局分别是 binaryen-129/bin/wasm-opt 与
          # wasm-bindgen-0.2.130/wasm-bindgen，因此直接整目录搬到目标位置。
          install_tool() {
            local target="$1" top="$2" exe="$3" tarball="$4" asset="$5" src
            rm -rf tool-extract
            mkdir -p tool-extract
            tar -xzf "$tarball" -C tool-extract
            src="$(find tool-extract -maxdepth 1 -type d -name "$top" | head -n1)"
            if [ -z "$src" ] || [ ! -e "$src/$exe" ]; then
              echo "::warning::$asset 解压结构异常（未找到 $exe）"
              rm -rf tool-extract "$tarball"
              return 1
            fi
            chmod +x "$src/$exe"
            rm -rf "$target"
            mkdir -p "$(dirname "$target")"
            cp -R "$src" "$target"
            rm -rf tool-extract "$tarball"
            return 0
          }

          # ---------- binaryen（wasm-opt） ----------
          BIN_TOOL_VERSION="129"
          BIN_RELEASE_VERSION="127"
          T_DETECTED="$(grep -a -o 'wasm-opt[0-9]\{3\}' "$DX_PATH" | head -n1 | grep -o '[0-9]\{3\}' || true)"
          R_DETECTED="$(grep -a -o 'binaryen-version_[0-9]\{3\}' "$DX_PATH" | head -n1 | grep -o '[0-9]\{3\}' || true)"
          [ -n "$T_DETECTED" ] && BIN_TOOL_VERSION="$T_DETECTED"
          [ -n "$R_DETECTED" ] && BIN_RELEASE_VERSION="$R_DETECTED"
          BIN_TARGET="$HOME/.dx/tools/binaryen-${BIN_TOOL_VERSION}"
          echo "binaryen：工具索引号 $BIN_TOOL_VERSION（目录 binaryen-${BIN_TOOL_VERSION}），release 版本 $BIN_RELEASE_VERSION"
          if [ -x "$BIN_TARGET/bin/wasm-opt" ]; then
            echo "binaryen 已存在：$BIN_TARGET/bin/wasm-opt"
          else
            if download_release \
                 "https://github.com/WebAssembly/binaryen/releases/download/version_${BIN_RELEASE_VERSION}/binaryen-version_${BIN_RELEASE_VERSION}-x86_64-linux.tar.gz" \
                 "WebAssembly/binaryen" "version_${BIN_RELEASE_VERSION}" \
                 "binaryen-version_${BIN_RELEASE_VERSION}-x86_64-linux.tar.gz" binaryen.tar.gz; then
              install_tool "$BIN_TARGET" "binaryen-version_${BIN_RELEASE_VERSION}" "bin/wasm-opt" binaryen.tar.gz \
                "binaryen-version_${BIN_RELEASE_VERSION}-x86_64-linux.tar.gz" \
                && echo "已安装 binaryen 到 $BIN_TARGET"
            else
              # 兜底：改用 apt 安装的 wasm-opt。
              # 关键点：必须落进 dx 的缓存目录，不能只用 PATH 上那个。
              # dx 只认 ~/.dx/tools/binaryen-<索引号>/bin/wasm-opt，
              # 目录里没有它就会自行去 GitHub 下载——就是那条不稳定的链路。
              # apt 的 binaryen 包提供 /usr/bin/wasm-opt 与
              # /usr/lib/x86_64-linux-gnu/libbinaryen.so，
              # 正好能拼出官方的 bin/ + lib/ 布局。
              echo "::warning::binaryen 下载失败，改用 apt 的 wasm-opt 兜底（版本可能偏旧）"
              rm -f binaryen.tar.gz
              APT_WASM_OPT="$(command -v wasm-opt || true)"
              if [ -n "$APT_WASM_OPT" ]; then
                mkdir -p "$BIN_TARGET/bin" "$BIN_TARGET/lib"
                cp -f "$APT_WASM_OPT" "$BIN_TARGET/bin/wasm-opt"
                chmod +x "$BIN_TARGET/bin/wasm-opt"
                # wasm-opt 动态链接 libbinaryen.so；系统路径里已有，
                # 这里再放一份只是为了对齐官方目录结构。
                for so in /usr/lib/x86_64-linux-gnu/libbinaryen.so*; do
                  [ -e "$so" ] || continue
                  cp -f "$so" "$BIN_TARGET/lib/" 2>/dev/null || true
                done
                echo "已从 apt 安装 wasm-opt 到 $BIN_TARGET/bin/wasm-opt"
                "$BIN_TARGET/bin/wasm-opt" --version || true
              else
                echo "::error::PATH 上也没有 wasm-opt，dx 构建期将无法优化 wasm"
              fi
            fi
          fi

          # ---------- wasm-bindgen-cli ----------
          # 版本号优先取项目 Cargo.lock 里的 wasm-bindgen：
          # dx 实际也是按项目锁文件决定要装哪个 wasm-bindgen-cli
          # （dx 二进制里的字符串是 "wasm-bindgen-cli@."，版本号是运行时拼上去的），
          # 所以这里必须跟项目锁文件保持一致，否则 dx 会认为版本不匹配再装一遍。
          WB_VERSION=""
          WB_LOCK="$(grep -A2 '^name = "wasm-bindgen"$' Cargo.lock 2>/dev/null \
            | grep -m1 '^version' | cut -d'"' -f2 || true)"
          if [ -n "$WB_LOCK" ]; then
            WB_VERSION="$WB_LOCK"
            echo "wasm-bindgen 版本来自 Cargo.lock：$WB_VERSION"
          fi
          if [ -z "$WB_VERSION" ]; then
            WB_VERSION="$(grep -a -o 'wasm-bindgen-cli@[0-9]\{1,2\}\.[0-9]\{1,2\}\.[0-9]\{1,2\}' "$DX_PATH" | head -n1 | sed 's/.*@//' || true)"
          fi
          if [ -z "$WB_VERSION" ]; then
            WB_VERSION="0.2.130"
          fi
          WB_TARGET="$HOME/.dx/tools/wasm-bindgen-${WB_VERSION}"
          echo "wasm-bindgen：版本 $WB_VERSION（目录 wasm-bindgen-${WB_VERSION}）"
          if [ -x "$WB_TARGET/wasm-bindgen" ]; then
            echo "wasm-bindgen 已存在：$WB_TARGET/wasm-bindgen"
          else
            if download_release \
                 "https://github.com/rustwasm/wasm-bindgen/releases/download/${WB_VERSION}/wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
                 "rustwasm/wasm-bindgen" "$WB_VERSION" \
                 "wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-gnu.tar.gz" wasm-bindgen.tar.gz; then
              install_tool "$WB_TARGET" "wasm-bindgen-${WB_VERSION}" "wasm-bindgen" wasm-bindgen.tar.gz \
                "wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
                && echo "已安装 wasm-bindgen 到 $WB_TARGET"
            else
              # 兜底：crates.io 源码编译 wasm-bindgen-cli。
              # dx 自己也有这条兜底（其二进制里含
              # "Failed to install prebuilt binary for wasm-bindgen-cli@... Compiling from source instead"），
              # 但那是在构建中途才触发，一旦 crates.io 也抖动就会直接中断整条流水线
              #（run #19 的日志就停在 "Installing wasm-bindgen-cli@0.2.130"）。
              # 这里提前装好并放进 dx 的缓存目录，dx 就不会再自己去下载。
              echo "::warning::wasm-bindgen 预装失败，改用 crates.io 源码编译"
              rm -f wasm-bindgen.tar.gz
              if cargo_install wasm-bindgen-cli "${WB_VERSION}" --locked; then
                mkdir -p "$WB_TARGET"
                cp -f "$CARGO_BIN/wasm-bindgen" "$WB_TARGET/wasm-bindgen"
                chmod +x "$WB_TARGET/wasm-bindgen"
                echo "已从 crates.io 安装 wasm-bindgen 到 $WB_TARGET"
              else
                echo "::warning::wasm-bindgen 兜底也失败，dx 将自行下载"
              fi
            fi
          fi

          echo "--- dx 工具目录 ---"
          ls -1 "$HOME/.dx/tools/" || true
          # 这里统一用 $BIN_TARGET（= ~/.dx/tools/binaryen-<工具索引号>）。
          # 之前这里还残留着旧变量 $TARGET_DIR——它在重构时被删掉了定义，
          # 引用却留了下来，于是在 set -u 下直接以「unbound variable」终止步骤
          # （run #21 就是这样挂的，表面看像「安装 dx 失败」，实际下载全都成功了）。
          if [ -x "$BIN_TARGET/bin/wasm-opt" ]; then
            echo "wasm-opt 路径：$BIN_TARGET/bin/wasm-opt"
            echo "wasm-opt 版本：$("$BIN_TARGET/bin/wasm-opt" --version 2>&1 | head -n1)"
          else
            echo "::warning::dx 缓存目录中无 wasm-opt，退回 PATH 上的：$(command -v wasm-opt || echo 无)"
            wasm-opt --version || true
          fi

      # ---------- 质量门禁 1：全量测试（P0 bug = 0） ----------
      - name: 全量测试
        run: |
          set +e
          cargo test --workspace 2>&1 | tee /tmp/mkv-cargo-test.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            echo "::error::cargo test --workspace 失败（exit ${RC}），关键输出如下："
            # 把错误行写成 annotations：公开仓库可直接通过 check-runs API 读取，无需 admin 下载日志
            grep -nE "^error|error\[E|panicked at|FAILED|failures:|test result: FAILED|could not compile|undefined reference|No such file|not found" \
              /tmp/mkv-cargo-test.log | tail -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$RC"

      - name: 移动端编译门禁（真机验证仍需人工，见 README）
        run: cargo build -p mkv-mobile

      # ---------- 质量门禁 1.5：正则引擎差分对拍 ----------
      #
      # 自研正则引擎（F-12）与 Python `re` 做 4000 例差分对拍：
      # 真实差异必须为 0。
      #
      # 为什么单列一道门禁：这个引擎是「手写回溯 VM + 计数式循环状态」，
      # 嵌套重复的最小次数约束曾经绕过 9 处真实差异，而 270 项单测**全部绿**
      # ——单测覆盖不到「引擎与参考引擎语义不一致」这一类缺陷。
      # 对拍装置（regex_fuzz_ref.py / regex_fuzz_run.rs / regex_fuzz_cmp.py）已入库。
      #
      # 含 `$` 的差异属**有意偏差**：Rust 侧 `$` 采用严格末尾语义
      # （与 Rust `regex` crate 一致），Python `re` 允许在末尾换行前匹配。
      - name: 正则引擎差分对拍（与 Python re 对齐）
        run: |
          set -euo pipefail
          mkdir -p .fuzz_tmp
          python3 packages/core/examples/regex_fuzz_ref.py > .fuzz_tmp/ref.tsv
          cargo run --release -p mkv-core --no-default-features --features web \
            --example regex_fuzz_run < .fuzz_tmp/ref.tsv > .fuzz_tmp/got.tsv
          python3 packages/core/examples/regex_fuzz_cmp.py .fuzz_tmp/ref.tsv .fuzz_tmp/got.tsv \
            | tee .fuzz_tmp/cmp.txt
          REAL="$(grep -E '^真实差异' .fuzz_tmp/cmp.txt | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
          echo "真实差异数：${REAL:-未知}"
          if [ "${REAL:-x}" != "0" ]; then
            echo "::error::正则引擎与 Python re 存在 ${REAL:-未知} 处真实差异（详见 .fuzz_tmp/cmp.txt）"
            exit 1
          fi
          echo "::notice::正则引擎与 Python re 语义一致（真实差异 0）"

      # ---------- 质量门禁 2：wasm32 零 C 依赖 ----------
      - name: 检查 wasm32 依赖树无原生 / C 依赖
        run: |
          set -euo pipefail
          COUNT="$(cargo tree -p mkv-web --target wasm32-unknown-unknown --edges normal,build \
            | grep -icE 'tantivy|zstd|jieba|rusqlite|git2|notify|(^| )cc v|cmake' || true)"
          echo "wasm32 原生/C 依赖命中数：$COUNT"
          [ "$COUNT" = "0" ] || { echo 'wasm32 依赖树被污染'; exit 1; }

      # ---------- 质量门禁 3：release 静态站点 ----------
      - name: 构建静态站点（导出索引 → dx release → dist/）
        run: |
          # 必须开 pipefail：否则 publish-web.sh 的非零退出码会被 tee 吞掉，
          # 表现为「构建成功」但产物缺失，后续门禁才以莫名其妙的方式失败
          # （run #18 就是这样：构建步骤显示 success，实际脚本早已失败）。
          set -o pipefail
          bash scripts/publish-web.sh 2>&1 | tee -a /tmp/mkv-ci.log

      - name: 校验静态产物清单与 wasm 体积门禁
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/mkv-index.json
          test -f dist/.nojekyll
          grep -q 'src="\./assets/' dist/index.html
          echo "dist 文件数：$(find dist -type f | wc -l)"
          du -sh dist
          # 体积门禁：wasm-opt -Oz --strip-debug 必须生效（剥离 dx 默认的 DWARF 段）。
          # 未优化约 820KB，优化后约 690KB；阈值 800KB 留出 binaryen 版本差异余量。
          # 未生效通常意味着 wasm-opt 未找到，应直接让 CI 失败而不是静默发布 1MB+ 产物。
          #
          # 注意：门禁阈值之外，wasm 的**体积本身**由 Cargo.toml 的
          # `lto = "fat"` + 自有 crate 的 `opt-level = "z"` 决定
          # （实测 891KB → 693KB）。改动这两项会让体积大幅漂移，
          # 提交前请用 scripts/publish-web.sh 本地复现并确认余量。
          #
          # 失败时必须把「真实原因」写进 annotation：job log 对无 admin 权限的
          # 匿名访问不可下载（403），只有 annotation 能通过 check-runs API 读到。
          # run #15 的排查卡点正是这里——门禁失败了，但日志里没有任何 wasm-opt 线索。
          python3 - <<'PY'
          import glob, json, os, sys

          info = json.load(open('dist/deploy-info.json', encoding='utf-8'))
          wasms = glob.glob('dist/assets/*.wasm')
          if len(wasms) != 1:
              msg = '产物中 wasm 数量异常：%s' % wasms
              print('::error::' + msg)
              sys.exit(1)
          size = os.path.getsize(wasms[0])
          opt = info.get('wasm_optimization')
          issue = info.get('wasm_opt_issue')
          version = info.get('wasm_opt_version')
          print('wasm bytes: %d  optimization: %s' % (size, opt))
          print('wasm-opt 版本: %s' % version)
          if size >= 800000:
              print('::error::wasm 未被有效优化: %d bytes（阈值 800000）' % size)
              print('::error::wasm-opt 版本: %s' % version)
              print('::error::wasm-opt 问题: %s' % (issue or '未记录（可能 wasm-opt 未找到）'))
              print('::error::优化记录: %s' % opt)
              sys.exit(1)
          if not opt:
              print('::error::产物体积达标但缺少优化记录，门禁逻辑异常，请检查 publish-web.sh')
              sys.exit(1)
          PY

      # ---------- 质量门禁 4：真实浏览器回归（核心链路 100%） ----------
      - name: 安装 Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright
          npx playwright install --with-deps chromium

      - name: 对 dist/ 跑 35 项浏览器交互回归
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist >/tmp/mkv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
          MKV_URL=http://127.0.0.1:8080 \
          MKV_BROWSER_CHANNEL=chromium \
          MKV_SHOT_DIR=docs/browser-validation/ci \
            node scripts/browser-check.cjs 2>&1 | tee -a /tmp/mkv-ci.log

      - name: 上传验证报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: docs/browser-validation/
          if-no-files-found: ignore

      - name: 汇总失败诊断（写入 annotations）
        if: failure()
        run: |
          set +e
          echo "::error::CI 失败，/tmp/mkv-ci.log 末尾 30 行："
          tail -n 30 /tmp/mkv-ci.log 2>/dev/null | while IFS= read -r line; do
            [ -z "$line" ] || echo "::error::$line"
          done

      - name: 上传失败诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            /tmp/mkv-cargo-test.log
            /tmp/mkv-ci.log
          if-no-files-found: ignore

      - name: 上传 Pages 产物
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 新仓库默认未启用 Pages，直接 deploy-pages 会报「需要先配置 Pages」，
      # 让质量门禁看起来像失败。这里先探测，未配置则跳过发布并给出提示。
      - name: 检查 Pages 是否已启用 GitHub Actions 构建
        id: pages_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/mkv-pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$CODE" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages 尚未配置（Settings → Pages → Source: GitHub Actions），本次跳过发布；verify 门禁不受影响。"
          fi
      - id: deployment
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
