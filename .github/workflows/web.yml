# Migrant Knowledge Vault —— Web 静态发布质量门禁
#
# 方案 A：纯静态托管，零后端。
# 门禁内容：单测/集成测试全绿 → wasm32 零 C 依赖 → release 静态构建
#          → Playwright 真实浏览器回归 28/28 → 发布 GitHub Pages。
#
# 为什么用 Linux runner + 预编译 dx：
#   Windows MSVC 下 `cargo install dioxus-cli` 会在链接 proc-macro DLL 时
#   挂起（link.exe 卡死 20+ 分钟），因此 CI 固定用 ubuntu + 官方预编译二进制。
#   版本必须与项目 dioxus 0.7.10 严格一致，否则 wasm-bindgen 冲突。

name: Web (static) — build & verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DX_VERSION: "0.7.10"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 质量门禁（测试 + 构建 + 浏览器回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 wasm32 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖（desktop / mobile 的 webkit2gtk + binaryen 兜底）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf binaryen
          # binaryen 提供 wasm-opt。apt 版本可能偏旧，因此这里只作为「兜底」，
          # 真正的版本自检放在体积门禁步骤里做（不满足能力要求会明确失败）。
          wasm-opt --version

      - name: 安装 dx（官方预编译二进制 + sha256 校验）
        run: |
          set -euo pipefail
          ASSET="dx-x86_64-unknown-linux-gnu.tar.gz"
          SHA_ASSET="dx-x86_64-unknown-linux-gnu.sha256"
          BASE="https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}"
          REPO_API="https://api.github.com/repos/DioxusLabs/dioxus"

          # 通道 A：releases/download 直链。通道 B：GitHub API 资产（按 asset id）。
          # 为什么不只留 A：release 直链走 objects.githubusercontent.com 的 CDN，
          # 在代理或网络抖动下会返回 504（run #13 就栽在这里，且整条流水线被跳过）；
          # 而 api.github.com 走独立链路，实测稳定返回 200 + 完整 33MB 资产。
          # 两个通道的 sha256 校验完全一致，安全性不降低。
          download_with_retry() {
            # $1=输出文件 $2=尝试次数上限
            local out="$1" tries="$2" i=1
            while [ "$i" -le "$tries" ]; do
              echo "  尝试 $i/$tries：$3"
              if eval "$3"; then
                return 0
              fi
              echo "  第 $i 次失败，5 秒后重试"
              i=$((i + 1))
              sleep 5
            done
            return 1
          }

          fetch_release() {
            # 通道 A
            curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
              -A "mkv-ci" "$BASE/$1" -o "$2"
          }

          fetch_api() {
            # 通道 B：先取 release 元数据拿 asset id，再用 octet-stream 下载
            local name="$1" out="$2" id
            id="$(curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
              -A "mkv-ci" "$REPO_API/releases/tags/v${DX_VERSION}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['id'] for a in d['assets'] if a['name']=='$name'))")"
            [ -n "$id" ] || return 1
            curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
              -H "Accept: application/octet-stream" -A "mkv-ci" \
              "$REPO_API/releases/assets/$id" -o "$out"
          }

          echo "下载 $ASSET（优先 release 直链，失败回退 API 资产通道）"
          download_with_retry dx.tar.gz 3 \
            'fetch_release "$ASSET" dx.tar.gz || fetch_api "$ASSET" dx.tar.gz'

          echo "下载 $SHA_ASSET"
          download_with_retry dx.sha256 3 \
            'fetch_release "$SHA_ASSET" dx.sha256 || fetch_api "$SHA_ASSET" dx.sha256'

          # 官方 .sha256 同时列了 tar.gz 与 zip 两行；必须按文件名只取目标那一行，
          # 否则 EXPECTED 会变成两行拼接的字符串，与实际 hash 永不相等（首跑即栽在这里）。
          EXPECTED="$(awk -v f="$ASSET" '$2 == f { print $1 }' dx.sha256)"
          [ -n "$EXPECTED" ] || { echo "::error::sha256 清单中没有 $ASSET"; cat dx.sha256; exit 1; }
          ACTUAL="$(sha256sum dx.tar.gz | cut -d' ' -f1)"
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::dx sha256 校验失败（expected=$EXPECTED actual=$ACTUAL）"
            exit 1
          fi
          mkdir -p dx-release
          tar -xzf dx.tar.gz -C dx-release
          DX_BIN="$(find dx-release -type f -name dx | head -n1)"
          [ -n "$DX_BIN" ] || { echo "::error::压缩包中未找到 dx"; tar -tzf dx.tar.gz; exit 1; }
          chmod +x "$DX_BIN"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$DX_BIN" "$HOME/.cargo/bin/dx"
          dx --version

          # ---------- 预装 binaryen（wasm-opt）到 dx 缓存目录 ----------
          # dx 在 release 构建时会自行下载 binaryen 到 ~/.dx/tools/binaryen-<ver>/bin/，
          # 该下载走 GitHub Release 直链，网络抖动时可能失败（run #15 即如此：
          # binaryen 没落地 → publish-web.sh 找不到 wasm-opt → 静默跳过体积优化 →
          # wasm 保持 1.27MB → 体积门禁失败）。
          #
          # 这里在 dx 装好之后「预先显式安装到 dx 期望的目录」，
          # dx 检测到目录已存在就不再自行下载，从根上消除该失败模式。
          # 版本号从 dx 可执行文件里探测（模板 binaryen-version_<ver>），
          # 避免 dx 升级后目录名漂移导致预置对不上。
          BINARYEN_VERSION="127"
          DETECTED="$(grep -a -o 'binaryen-version_[0-9]\{3\}' "$HOME/.cargo/bin/dx" | head -n1 | grep -o '[0-9]\{3\}' || true)"
          if [ -n "$DETECTED" ]; then
            BINARYEN_VERSION="$DETECTED"
            echo "从 dx 探测到 binaryen 版本：$BINARYEN_VERSION"
          fi
          BIN_ASSET="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          TARGET_DIR="$HOME/.dx/tools/binaryen-${BINARYEN_VERSION}"
          BIN_API="https://api.github.com/repos/WebAssembly/binaryen"

          mkdir -p "$TARGET_DIR/bin"
          if [ -x "$TARGET_DIR/bin/wasm-opt" ]; then
            echo "binaryen 已存在：$TARGET_DIR/bin/wasm-opt"
          else
            echo "下载 $BIN_ASSET（直链优先，失败回退 API 资产通道）"
            BIN_OK=0
            for attempt in 1 2 3; do
              if curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors -A "mkv-ci" \
                   "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${BIN_ASSET}" \
                   -o binaryen.tar.gz; then
                BIN_OK=1; break
              fi
              echo "  直链失败，尝试 API 资产通道"
              BIN_ID="$(curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors -A "mkv-ci" \
                "$BIN_API/releases/tags/version_${BINARYEN_VERSION}" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['id'] for a in d['assets'] if a['name']=='$BIN_ASSET'))" 2>/dev/null || true)"
              if [ -n "$BIN_ID" ] && curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors \
                   -H "Accept: application/octet-stream" -A "mkv-ci" \
                   "$BIN_API/releases/assets/$BIN_ID" -o binaryen.tar.gz; then
                BIN_OK=1; break
              fi
              echo "  第 $attempt 次下载失败，5 秒后重试"
              sleep 5
            done
            if [ "$BIN_OK" != "1" ]; then
              # 不阻断：apt 的 binaryen 仍在 PATH 上作为兜底；
              # 但把原因写进 annotation，避免又一次「门禁失败却无线索」。
              echo "::warning::binaryen 下载失败，将退回 apt 的 wasm-opt（版本可能偏旧）"
              rm -f binaryen.tar.gz
            else
              # binaryen 官方 tar 解压后是 binaryen-version_<ver>/{bin,lib}，
              # 必须整目录搬过去（只放 bin/wasm-opt 会让 dx 认为安装不完整而重新下载，
              # 那正是 run #15 的失败模式）。
              rm -rf binaryen-extract
              mkdir -p binaryen-extract
              tar -xzf binaryen.tar.gz -C binaryen-extract
              SRC_DIR="$(find binaryen-extract -maxdepth 1 -type d -name 'binaryen-version_*' | head -n1)"
              if [ -z "$SRC_DIR" ] || [ ! -x "$SRC_DIR/bin/wasm-opt" ]; then
                echo "::warning::binaryen 压缩包结构异常，未找到 bin/wasm-opt"
              else
                rm -rf "$TARGET_DIR"
                mkdir -p "$(dirname "$TARGET_DIR")"
                cp -R "$SRC_DIR" "$TARGET_DIR"
                chmod +x "$TARGET_DIR/bin/wasm-opt"
                echo "已安装 binaryen 到 $TARGET_DIR"
                # 额外装一份到 /usr/local/bin：publish-web.sh 在 dx 缓存缺失时
                # 会退到 PATH，这里确保 PATH 上拿到的是我们下载的版本
                # （而不是 apt 里可能很旧的 binaryen）。
                install -m 0755 "$TARGET_DIR/bin/wasm-opt" /usr/local/bin/wasm-opt
                echo "已安装 wasm-opt 到 /usr/local/bin/wasm-opt"
              fi
              rm -rf binaryen-extract binaryen.tar.gz
            fi
          fi

          if [ -x "$TARGET_DIR/bin/wasm-opt" ]; then
            echo "wasm-opt 路径：$TARGET_DIR/bin/wasm-opt"
            echo "wasm-opt 版本：$("$TARGET_DIR/bin/wasm-opt" --version 2>&1 | head -n1)"
          else
            echo "::warning::dx 缓存目录中无 wasm-opt，退回 PATH 上的：$(command -v wasm-opt || echo 无)"
            wasm-opt --version || true
          fi

      # ---------- 质量门禁 1：全量测试（P0 bug = 0） ----------
      - name: 全量测试
        run: |
          set +e
          cargo test --workspace 2>&1 | tee /tmp/mkv-cargo-test.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            echo "::error::cargo test --workspace 失败（exit ${RC}），关键输出如下："
            # 把错误行写成 annotations：公开仓库可直接通过 check-runs API 读取，无需 admin 下载日志
            grep -nE "^error|error\[E|panicked at|FAILED|failures:|test result: FAILED|could not compile|undefined reference|No such file|not found" \
              /tmp/mkv-cargo-test.log | tail -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$RC"

      - name: 移动端编译门禁（真机验证仍需人工，见 README）
        run: cargo build -p mkv-mobile

      # ---------- 质量门禁 2：wasm32 零 C 依赖 ----------
      - name: 检查 wasm32 依赖树无原生 / C 依赖
        run: |
          set -euo pipefail
          COUNT="$(cargo tree -p mkv-web --target wasm32-unknown-unknown --edges normal,build \
            | grep -icE 'tantivy|zstd|jieba|rusqlite|git2|notify|(^| )cc v|cmake' || true)"
          echo "wasm32 原生/C 依赖命中数：$COUNT"
          [ "$COUNT" = "0" ] || { echo 'wasm32 依赖树被污染'; exit 1; }

      # ---------- 质量门禁 3：release 静态站点 ----------
      - name: 构建静态站点（导出索引 → dx release → dist/）
        run: |
          # 必须开 pipefail：否则 publish-web.sh 的非零退出码会被 tee 吞掉，
          # 表现为「构建成功」但产物缺失，后续门禁才以莫名其妙的方式失败
          # （run #18 就是这样：构建步骤显示 success，实际脚本早已失败）。
          set -o pipefail
          bash scripts/publish-web.sh 2>&1 | tee -a /tmp/mkv-ci.log

      - name: 校验静态产物清单与 wasm 体积门禁
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/mkv-index.json
          test -f dist/.nojekyll
          grep -q 'src="\./assets/' dist/index.html
          echo "dist 文件数：$(find dist -type f | wc -l)"
          du -sh dist
          # 体积门禁：wasm-opt -Oz --strip-debug 必须生效（剥离 dx 默认的 DWARF 段）。
          # 未优化约 1.2MB，优化后约 650KB；阈值 800KB 留出 binaryen 版本差异余量。
          # 未生效通常意味着 wasm-opt 未找到，应直接让 CI 失败而不是静默发布 1MB+ 产物。
          #
          # 失败时必须把「真实原因」写进 annotation：job log 对无 admin 权限的
          # 匿名访问不可下载（403），只有 annotation 能通过 check-runs API 读到。
          # run #15 的排查卡点正是这里——门禁失败了，但日志里没有任何 wasm-opt 线索。
          python3 - <<'PY'
          import glob, json, os, sys

          info = json.load(open('dist/deploy-info.json', encoding='utf-8'))
          wasms = glob.glob('dist/assets/*.wasm')
          if len(wasms) != 1:
              msg = '产物中 wasm 数量异常：%s' % wasms
              print('::error::' + msg)
              sys.exit(1)
          size = os.path.getsize(wasms[0])
          opt = info.get('wasm_optimization')
          issue = info.get('wasm_opt_issue')
          version = info.get('wasm_opt_version')
          print('wasm bytes: %d  optimization: %s' % (size, opt))
          print('wasm-opt 版本: %s' % version)
          if size >= 800000:
              print('::error::wasm 未被有效优化: %d bytes（阈值 800000）' % size)
              print('::error::wasm-opt 版本: %s' % version)
              print('::error::wasm-opt 问题: %s' % (issue or '未记录（可能 wasm-opt 未找到）'))
              print('::error::优化记录: %s' % opt)
              sys.exit(1)
          if not opt:
              print('::error::产物体积达标但缺少优化记录，门禁逻辑异常，请检查 publish-web.sh')
              sys.exit(1)
          PY

      # ---------- 质量门禁 4：真实浏览器回归（核心链路 100%） ----------
      - name: 安装 Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright
          npx playwright install --with-deps chromium

      - name: 对 dist/ 跑 28 项浏览器交互回归
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist >/tmp/mkv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
          MKV_URL=http://127.0.0.1:8080 \
          MKV_BROWSER_CHANNEL=chromium \
          MKV_SHOT_DIR=docs/browser-validation/ci \
            node scripts/browser-check.cjs 2>&1 | tee -a /tmp/mkv-ci.log

      - name: 上传验证报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: docs/browser-validation/
          if-no-files-found: ignore

      - name: 汇总失败诊断（写入 annotations）
        if: failure()
        run: |
          set +e
          echo "::error::CI 失败，/tmp/mkv-ci.log 末尾 30 行："
          tail -n 30 /tmp/mkv-ci.log 2>/dev/null | while IFS= read -r line; do
            [ -z "$line" ] || echo "::error::$line"
          done

      - name: 上传失败诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            /tmp/mkv-cargo-test.log
            /tmp/mkv-ci.log
          if-no-files-found: ignore

      - name: 上传 Pages 产物
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 新仓库默认未启用 Pages，直接 deploy-pages 会报「需要先配置 Pages」，
      # 让质量门禁看起来像失败。这里先探测，未配置则跳过发布并给出提示。
      - name: 检查 Pages 是否已启用 GitHub Actions 构建
        id: pages_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/mkv-pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$CODE" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages 尚未配置（Settings → Pages → Source: GitHub Actions），本次跳过发布；verify 门禁不受影响。"
          fi
      - id: deployment
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
